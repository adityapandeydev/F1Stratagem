[package]
name = "f1-analysis"
version = "0.1.0"
edition = "2021"
publish = false
description = "F1Stratagem analysis service: measurements computed from the archive's raw data"

[lib]
name = "analysis"
path = "src/lib.rs"

[[bin]]
name = "analysis"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arrow-array = "56"
arrow-cast = "56"
arrow-schema = "56"
clap = { version = "4.5", features = ["derive"] }
nalgebra = "0.33"
parquet = { version = "56", default-features = false, features = ["arrow", "zstd", "snap"] }

[profile.release]
opt-level = 3
