[package]
name = "predictor-race-native"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native lap-by-lap race simulation for the F1Stratagem race model"

[lib]
name = "predictor_race_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
numpy = "0.22"
rayon = "1.10"
rand = "0.8"
rand_pcg = "0.3"
rand_distr = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
