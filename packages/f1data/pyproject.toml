[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1data"
version = "0.1.0"
description = "F1Stratagem data archive: collection, verification and readers for FastF1, Jolpica, Open-Meteo and FIA documents"
requires-python = ">=3.10"
dependencies = [
    "fastf1==3.9.0",
    "pandas>=2.2,<3",
    "pyarrow>=18",
    "requests>=2.32,<3",
    "pdfplumber>=0.11,<1",
    "pypdfium2>=4",
    "psutil>=6",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
f1data = "f1data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f1data = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
